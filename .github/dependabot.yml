# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: main

  - package-ecosystem: "gomod"
    allow:
      - dependency-type: direct
    directories:
      - "/"
    # Block Dependabot from looking at the examples directory entirely, it's
    # decided ghost go.mod files live there.
    exclude-paths:
      - "examples/**"
    groups:
      default:
        patterns:
          - "*"
    schedule:
      interval: "weekly"
    target-branch: main
